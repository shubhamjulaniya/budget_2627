// ---------- Section management ----------
function addSection(name) {
  const trimmed = (name||'').trim();
  if (!trimmed) { showToast('Section name required', 'error'); return; }
  if (SECTIONS.includes(trimmed)) { showToast('Section already exists', 'error'); return; }
  SECTIONS.push(trimmed);
  state.sections = [...SECTIONS];
  saveState();
  refreshActiveView();
  showToast(`Section "${trimmed}" added`);
}
function renameSection(oldName, newName) {
  const trimmed = (newName||'').trim();
  if (RESERVED_SECTIONS.includes(oldName)) { showToast(`"${oldName}" cannot be renamed (reserved)`, 'error'); return; }
  if (!trimmed) { showToast('New name required', 'error'); return; }
  if (trimmed === oldName) return;
  if (SECTIONS.includes(trimmed)) { showToast('Section name already exists', 'error'); return; }
  // Cascade rename to budget + transactions
  const idx = SECTIONS.indexOf(oldName);
  if (idx >= 0) SECTIONS[idx] = trimmed;
  state.sections = [...SECTIONS];
  state.budget.forEach(b => { if (b.section === oldName) b.section = trimmed; });
  state.transactions.forEach(t => { if (t.section === oldName) t.section = trimmed; });
  // Restore collapsed state under new name
  if (collapsedSections[oldName] !== undefined) {
    collapsedSections[trimmed] = collapsedSections[oldName];
    delete collapsedSections[oldName];
    try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedSections)); } catch(e) {}
  }
  saveState();
  refreshActiveView();
  showToast(`Renamed to "${trimmed}"`);
}

// ---------- Animated number counters ----------
function animateNumber(el, end, duration=600) {
  if (!el || !isFinite(end)) return;
  const startTime = performance.now();
  const start = 0;
  const isInt = Number.isInteger(end);
  function tick(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const current = start + (end - start) * eased;
    el.textContent = fmtINR(isInt ? Math.round(current) : current);
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = fmtINR(end);
  }
  requestAnimationFrame(tick);
}
function animateAllKPIs() {
  document.querySelectorAll('.kpi .value[data-animate]').forEach(el => {
    const target = parseFloat(el.dataset.animate);
    if (!isNaN(target)) animateNumber(el, target, 600);
  });
}

// ---------- AI-style insights ----------
function buildInsights(cycle) {
  const out = [];
  const incomeAct = actualByCycle(cycle, s => s==='Income');
  const incomeBud = budgetTotal(s => s==='Income');
  const expAct    = actualByCycle(cycle, s => s!=='Income' && !isSavSec(s));
  const expBud    = budgetTotal(s => s!=='Income' && !isSavSec(s));
  const savAct    = actualByCycle(cycle, s => isSavSec(s));
  const outflow   = expAct + savAct;
  const c = getCycles().find(x => x.name === cycle);
  const today = new Date(); today.setHours(0,0,0,0);
  const cycleProgress = c && today >= c.start
    ? Math.min(1, (today - c.start) / (c.end - c.start))
    : 0;

  // Savings rate
  if (incomeAct > 0) {
    const sr = (incomeAct - outflow) / incomeAct;
    if (sr >= 0.30) out.push({ tone:'good', icon:'🎯', text:`<strong>${(sr*100).toFixed(0)}% savings rate</strong> this cycle — top tier` });
    else if (sr >= 0.15) out.push({ tone:'neutral', icon:'✅', text:`Savings rate <strong>${(sr*100).toFixed(0)}%</strong> — solid` });
    else if (sr < 0) out.push({ tone:'bad', icon:'⚠️', text:`<strong>Spending exceeds income</strong> this cycle` });
    else out.push({ tone:'neutral', icon:'📊', text:`Savings rate <strong>${(sr*100).toFixed(0)}%</strong>` });
  }

  // Per-section overspend / underspend (only meaningful sections, expense-side)
  SECTIONS.filter(s => s !== 'Income' && !isSavSec(s)).forEach(sec => {
    const bud = state.budget.filter(b => b.section === sec).reduce((s,b) => s + (Number(b.monthly)||0), 0);
    const act = actualByCycle(cycle, s => s === sec);
    if (bud === 0) return;
    const ratio = act / bud;
    if (ratio > 1.10) out.push({ tone:'bad', icon:'🔴', text:`<strong>${sectionEmoji(sec)} ${sec}</strong> overspent by <strong>${fmtINR(act-bud)}</strong> (${((ratio-1)*100).toFixed(0)}% over)` });
    else if (ratio > 0.85 && cycleProgress < 0.85) out.push({ tone:'neutral', icon:'⚡', text:`<strong>${sectionEmoji(sec)} ${sec}</strong> at <strong>${(ratio*100).toFixed(0)}%</strong> with ${((1-cycleProgress)*100).toFixed(0)}% of cycle left` });
    else if (ratio < 0.5 && cycleProgress > 0.5) out.push({ tone:'good', icon:'💪', text:`<strong>${sectionEmoji(sec)} ${sec}</strong> only <strong>${(ratio*100).toFixed(0)}%</strong> used — well under` });
  });

  // Cycle forecast
  if (cycleProgress > 0.1 && cycleProgress < 1) {
    const projected = outflow / cycleProgress;
    const projVsBudget = projected - (expBud + budgetTotal(s => isSavSec(s)));
    if (Math.abs(projVsBudget) > 1000) {
      const tone = projVsBudget < 0 ? 'good' : 'bad';
      const icon = projVsBudget < 0 ? '📉' : '📈';
      const dir = projVsBudget < 0 ? 'under' : 'over';
      out.push({ tone, icon, text:`Pace projects cycle <strong>${dir} budget by ${fmtINR(Math.abs(projVsBudget))}</strong>` });
    }
  }

  // Top expense merchant
  const tx = txAll().filter(t => t.cycle===cycle && t.type!=='transfer' && t.section!=='Income');
  const merchants = {};
  tx.forEach(t => {
    const key = (t.description||'').split(/[-_]/)[0].trim().slice(0, 20) || '(unnamed)';
    merchants[key] = (merchants[key]||0) + (Number(t.amount)||0);
  });
  const top = Object.entries(merchants).sort((a,b) => b[1]-a[1])[0];
  if (top && top[1] > 500) out.push({ tone:'neutral', icon:'🛍️', text:`Top vendor: <strong>${escapeHTML(top[0])}</strong> at <strong>${fmtINR(top[1])}</strong>` });

  return out.slice(0, 6);
}
function renderInsightsHTML(cycle) {
  const insights = buildInsights(cycle);
  if (!insights.length) return '';
  const toneColor = { good:'var(--green)', neutral:'var(--navy)', bad:'var(--red)' };
  const toneBg = { good:'var(--green-soft)', neutral:'var(--blue-soft)', bad:'var(--red-soft)' };
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
    ${insights.map(i => `<div style="background:${toneBg[i.tone]};color:${toneColor[i.tone]};padding:8px 14px;border-radius:100px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid ${toneColor[i.tone]}33;">
      <span style="font-size:14px;">${i.icon}</span> ${i.text}
    </div>`).join('')}
  </div>`;
}

// ---------- Confetti on goal hit ----------
function fireConfetti() {
  if (typeof confetti !== 'function') return;
  confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors:['#6366F1','#8B5CF6','#EC4899','#06B6D4','#10B981'] });
  setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 } }), 200);
  setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 } }), 400);
}
function checkGoalHit(beforeBudget, afterBudget, beforeYTD, afterYTD) {
  // Triggers when a Savings sub-category crosses its annual target with this transaction
  for (const sub in afterYTD) {
    const target = (afterBudget[sub]||0) * 12;
    if (target > 0 && (beforeYTD[sub]||0) < target && afterYTD[sub] >= target) {
      showToast(`🎉 Goal hit: ${sub} crossed annual target!`, 'success');
      fireConfetti();
      return;
    }
  }
}
function snapshotSavingsYTD() {
  const out = {};
  state.transactions.filter(t => t.type !== 'transfer' && isSavSec(t.section)).forEach(t => {
    out[t.subcategory] = (out[t.subcategory]||0) + (Number(t.amount)||0);
  });
  return out;
}
function snapshotBudget() {
  const out = {};
  state.budget.filter(b => isSavSec(b.section)).forEach(b => { out[b.subcategory] = Number(b.monthly)||0; });
  return out;
}

function moveSection(name, direction) {
  const idx = SECTIONS.indexOf(name);
  if (idx < 0) return;
  const newIdx = idx + (direction === 'up' ? -1 : 1);
  if (newIdx < 0 || newIdx >= SECTIONS.length) return;
  [SECTIONS[idx], SECTIONS[newIdx]] = [SECTIONS[newIdx], SECTIONS[idx]];
  state.sections = [...SECTIONS];
  saveState();
  refreshActiveView();
}
function deleteSection(name) {
  if (RESERVED_SECTIONS.includes(name)) { showToast(`"${name}" cannot be deleted (reserved)`, 'error'); return; }
  const budgetCount = state.budget.filter(b => b.section === name).length;
  const txCount     = state.transactions.filter(t => t.section === name).length;
  const msg = `Delete section "${name}"?\n\n` +
    `This will also delete ${budgetCount} budget row${budgetCount!==1?'s':''} and ${txCount} transaction${txCount!==1?'s':''} under it.\n\nThis cannot be undone.`;
  if (!confirm(msg)) return;
  SECTIONS = SECTIONS.filter(s => s !== name);
  state.sections = [...SECTIONS];
  state.budget = state.budget.filter(b => b.section !== name);
  state.transactions = state.transactions.filter(t => t.section !== name);
  saveState();
  refreshActiveView();
  showToast(`Section "${name}" deleted`);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `budget-fy2627-backup-${todayISO()}.json`;

function importJSONFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('Replace current data with the imported file?')) return;
      state = {
        budget: data.budget || [],
        transactions: data.transactions || [],
        accounts: data.accounts || JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)),
        balances: data.balances || [],
        wealthItems: data.wealthItems || [],
        wealthRecons: data.wealthRecons || [],
        selectedCycle: data.selectedCycle || currentCycleName(),
      };
      saveState();
      refreshActiveView();
      showToast('Data imported');
    } catch (err) {
      showToast('Invalid JSON file', 'error');
    }
  };
  reader.readAsText(file);
}
function exportXLSX() {
  const wb = XLSX.utils.book_new();
  // Budget sheet
  const budgetData = [['Section','Sub-Category','Monthly Budget','Annual Budget','Notes']];
  state.budget.forEach(b => budgetData.push([b.section, b.subcategory, b.monthly||0, (b.monthly||0)*12, b.notes||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(budgetData), 'Budget');

  // Transactions sheet
  const txData = [['Date','Description','Section','Sub-Category','Amount','Payment Mode','Account','Cycle','Notes']];
  txAll().sort((a,b) => a.date.localeCompare(b.date)).forEach(t => {
    txData.push([t.date, t.description, t.section, t.subcategory, t.amount, t.paymentMode, t.account, t.cycle, t.notes||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txData), 'Transactions');

  // Balances sheet
  const balData = [['Date','Account','Balance']];
  [...state.balances].sort((a,b)=>a.date.localeCompare(b.date)).forEach(b => balData.push([b.date,b.account,b.balance]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(balData), 'Balances');

  // Yearly view
  const ySheet = [['Section','Sub-Category','Annual Budget','Actual YTD','Variance','Var %']];
  yearlyTotals().forEach(y => ySheet.push([y.section, y.subcategory, y.annualBudget, y.actual, y.variance, y.pct===null?'':y.pct]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ySheet), 'Yearly');

  // Cycle Summary
  const cs = [['Cycle','Income','Expense','Savings','Net']];
  trendByCycle().forEach(t => cs.push([t.cycle, t.income, t.expense, t.savings, t.income-t.expense-t.savings]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cs), 'Cycle Summary');

  XLSX.writeFile(wb, `Budget-FY2627-export-${todayISO()}.xlsx`);
  showToast('Excel file downloaded');
}

// ---------- Password gate ----------
const PWD_HASH_KEY = 'budget_dashboard_v2_fy2627__pwd';
const PWD_UNLOCKED_KEY = 'budget_dashboard_v2_fy2627__unlocked';

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function getPasswordHash() { return localStorage.getItem(PWD_HASH_KEY); }
async function setPassword(pwd) { localStorage.setItem(PWD_HASH_KEY, await sha256(pwd)); }
function clearPassword() { localStorage.removeItem(PWD_HASH_KEY); sessionStorage.removeItem(PWD_UNLOCKED_KEY); }

function showLock(mode='enter') {
  const lock = document.getElementById('lockscreen');
  const pwd2 = document.getElementById('lockPwd2');
  const title = document.getElementById('lockTitle');
  const msg = document.getElementById('lockMsg');
  const btn = document.getElementById('lockBtn');
  if (mode === 'create') {
    title.textContent = 'Set a Password';
    msg.textContent = 'First-time setup: choose a password to protect your dashboard. You’ll need this every time you open the app on this device.';
    pwd2.style.display = '';
    btn.textContent = 'Create Password';
  } else {
    title.textContent = 'Budget Dashboard';
    msg.textContent = 'Enter your password to unlock';
    pwd2.style.display = 'none';
    btn.textContent = 'Unlock';
  }
  lock.classList.remove('hidden');
  document.getElementById('lockErr').textContent = '';
  document.getElementById('lockPwd').value = '';
  document.getElementById('lockPwd2').value = '';
  setTimeout(() => document.getElementById('lockPwd').focus(), 50);
}
function hideLock() { document.getElementById('lockscreen').classList.add('hidden'); }

async function lockSubmit() {
  const pwd = document.getElementById('lockPwd').value;
  const pwd2 = document.getElementById('lockPwd2').value;
  const errEl = document.getElementById('lockErr');
  const card = document.getElementById('lockCard');
  const shake = () => { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };
  const existingHash = getPasswordHash();
  if (!existingHash) {
    if (!pwd || pwd.length < 4) { errEl.textContent = 'Password must be at least 4 characters'; shake(); return; }
    if (pwd !== pwd2) { errEl.textContent = 'Passwords don’t match'; shake(); return; }
    await setPassword(pwd);
    sessionStorage.setItem(PWD_UNLOCKED_KEY, '1');
    hideLock(); appBoot();
  } else {
    const hash = await sha256(pwd);
    if (hash === existingHash) {
      sessionStorage.setItem(PWD_UNLOCKED_KEY, '1');
      hideLock(); appBoot();
    } else {
      errEl.textContent = 'Incorrect password'; shake();
      document.getElementById('lockPwd').value = '';
    }
  }
}
function lockForgot() {
  if (!confirm('This will delete ALL your data AND reset the password. Make sure you have a JSON backup. Continue?')) return;
  if (!confirm('REALLY delete everything? This cannot be undone.')) return;
  localStorage.clear(); sessionStorage.clear(); location.reload();
}
function changePassword() {
  const cur = prompt('Enter current password:'); if (cur === null) return;
  sha256(cur).then(h => {
    if (h !== getPasswordHash()) { showToast('Incorrect current password', 'error'); return; }
    const nw = prompt('Enter new password (min 4 chars):'); if (!nw) return;
    if (nw.length < 4) { showToast('Too short', 'error'); return; }
    const nw2 = prompt('Confirm new password:');
    if (nw !== nw2) { showToast('Passwords don’t match', 'error'); return; }
    setPassword(nw).then(() => showToast('Password changed'));
  });
}
function removePassword() {
  const cur = prompt('Enter current password to remove protection:'); if (cur === null) return;
  sha256(cur).then(h => {
    if (h !== getPasswordHash()) { showToast('Incorrect password', 'error'); return; }
    if (!confirm('Remove password protection? Anyone with the URL on this device will be able to open the dashboard.')) return;
    clearPassword();
    showToast('Password removed');
    renderSettings();
  });
}
function lockNow() {
  sessionStorage.removeItem(PWD_UNLOCKED_KEY);
  showLock('enter');
}

async function applyRemoteState(remoteState) {
  if (!remoteState) return;
  // Note: _suppressNextSave is NOT set here. We removed the real-time listener,
  // so there is no Firestore echo to suppress. Suppressing saves here would
  // silently drop the user's first action after page load.
  state.budget        = remoteState.budget        || [];
  state.transactions  = remoteState.transactions  || [];
  state.accounts      = remoteState.accounts      || JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
  state.wealthItems   = remoteState.wealthItems   || [];
  state.wealthRecons  = remoteState.wealthRecons  || [];
  state.selectedCycle = remoteState.selectedCycle || currentCycleName();
  // Backfill openingBalance for any old wealthItems that predate the field
  state.wealthItems.forEach(w => { if (w.openingBalance === undefined) w.openingBalance = Number(w.value)||0; });
  // Deduplicate balances — keep only the most recent reconciliation entry per account
  const _rawBal = remoteState.balances || [];
  const _latestBal = {};
  _rawBal.forEach(b => { if (!_latestBal[b.account] || b.date > _latestBal[b.account].date) _latestBal[b.account] = b; });
  state.balances = Object.values(_latestBal);
  // Load sections from Firestore, then heal any missing ones
  if (Array.isArray(remoteState.sections) && remoteState.sections.length) {
    state.sections = [...remoteState.sections];
  } else {
    // Derive from budget rows if sections array missing entirely
    const fromBudget = [];
    state.budget.forEach(b => { if (b.section && !fromBudget.includes(b.section)) fromBudget.push(b.section); });
    state.sections = fromBudget.length ? fromBudget : [...DEFAULT_SECTIONS];
  }
  // Heal: ensure every section referenced in budget rows is in sections list
  state.budget.forEach(b => {
    if (b.section && !state.sections.includes(b.section)) state.sections.push(b.section);
  });
  // Heal: ensure every section referenced in transactions is in sections list
  state.transactions.forEach(t => {
    if (t.section && t.section !== 'Income' && !state.sections.includes(t.section)) state.sections.push(t.section);
  });
  // Heal: reserved sections always present
  RESERVED_SECTIONS.forEach(s => { if (!state.sections.includes(s)) state.sections.push(s); });
  // Sync SECTIONS global
  SECTIONS.length = 0;
  SECTIONS.push(...state.sections);
  refreshActiveView();
}

async function bootForUser(user) {
  window._fbUser = user;
  const docRef = window._fbDb.collection('users').doc(user.uid).collection('state').doc('main');
  const snap = await docRef.get();
  if (!snap.exists) {
    // First sign-in — migrate from localStorage if data exists
    loadState();
    if (state.transactions.length || state.budget.length) {
      await docRef.set({ ...state, _updatedAt: new Date().toISOString() });
      showToast('Migrated existing data to cloud ✓');
    }
  } else {
    // Load from Firestore on boot only — no real-time listener to avoid overwrites
    const data = snap.data();
    showToast('Loading: ' + (data.transactions||[]).length + ' txns, ' + (data.wealthItems||[]).length + ' wealth items from cloud');
    await applyRemoteState(data);
  }
  // No real-time listener — saves are explicit via saveState() on every change
  hideLock();
  const validCycles = getCycles().map(c => c.name);
  if (!validCycles.includes(state.selectedCycle)) state.selectedCycle = validCycles[0];
  document.querySelectorAll('.nav button, .bottom-tab-bar button').forEach(btn => {
    btn.removeEventListener('click', btn._navHandler || (()=>{}));
    btn._navHandler = () => setView(btn.dataset.view);
    btn.addEventListener('click', btn._navHandler);
  });
  setView('dashboard');
}

// ---------- Init ----------
function init() {
  // Show auth screen by default while Firebase determines auth state
  showAuthScreen('signin');
  // Wire Enter key for both fields
  document.getElementById('lockscreen').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const isSignup = document.getElementById('lockTitle').textContent.includes('Create');
      authSubmit(isSignup ? 'signup' : 'signin');
    }
  });
  // Listen for auth state changes
  window._fbAuth.onAuthStateChanged(user => {
    if (user) {
      bootForUser(user).catch(e => {
        console.error('Boot failed:', e);
        showToast('Could not load data: ' + e.message, 'error');
      });
    } else {
      // Signed out
      if (_firestoreUnsub) { _firestoreUnsub(); _firestoreUnsub = null; }
      window._fbUser = null;
      showAuthScreen('signin');
    }
  });
}
function appBoot() {
  loadState();
  const validCycles = getCycles().map(c => c.name);
  if (!validCycles.includes(state.selectedCycle)) state.selectedCycle = validCycles[0];
  document.querySelectorAll('.nav button, .bottom-tab-bar button').forEach(btn => {
    btn.addEventListener('click', () => setView(btn.dataset.view));
  });
  setView('dashboard');
}
window.addEventListener('DOMContentLoaded', init);
