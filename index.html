<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Dashboard FY2026-27</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<!-- Firebase v10 compat SDK for global access from non-module script -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root {
  /* Slice Bank: white-first, pure black numbers, single muted purple accent */
  --navy: #0F0F0F;            /* near-black for primary text */
  --navy-dark: #000000;       /* pure black */
  --teal: #5E5DCD;            /* muted purple accent (single accent color) */
  --gold: #5E5DCD;
  --gold-soft: #F0EFFE;
  --green: #1A8754;           /* clean banking green */
  --green-soft: #E8F5EE;
  --red: #D32F2F;             /* clean banking red */
  --red-soft: #FBEAEA;
  --amber: #C0852C;
  --amber-soft: #FBF4E4;
  --blue-soft: #F0EFFE;       /* very subtle purple tint */
  --blue-text: #5E5DCD;
  --grey-50: #FFFFFF;         /* pure white — slice's theme-color */
  --grey-100: #FAFAFA;
  --grey-200: #F0F0F0;        /* hairline borders */
  --grey-300: #E5E5E5;
  --grey-400: #A8A8A8;
  --grey-500: #6B6B6B;
  --grey-700: #2A2A2A;
  --grey-900: #0F0F0F;
  --neon: #5E5DCD;
  --neon-2: #8B8AD8;
  --grad-primary: linear-gradient(135deg, #0F0F0F 0%, #2A2A2A 100%);
  --grad-cool: linear-gradient(135deg, #5E5DCD 0%, #8B8AD8 100%);
  --grad-night: linear-gradient(180deg, #0F0F0F 0%, #1A1A1A 50%, #2A2A2A 100%);
  --grad-bg: #FFFFFF;
  --glass-bg: #FFFFFF;        /* solid white — no more glass-morphism */
  --glass-border: #F0F0F0;
  --glass-shadow: none;
  --shadow-sm: 0 1px 2px rgba(15,15,15,.04);
  --shadow: 0 1px 3px rgba(15,15,15,.05);
  --shadow-md: 0 2px 8px rgba(15,15,15,.08);
  --shadow-glow: 0 0 0 3px rgba(94,93,205,.15);
  --radius: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", system-ui, sans-serif;
  background: var(--grad-bg);
  background-attachment: fixed;
  color: var(--grey-900);
  font-size: 13px;     /* compact: 14 -> 13 */
  line-height: 1.4;    /* compact: 1.5 -> 1.4 */
}
/* === Compact density overrides === */
.page-header { margin-bottom: 12px; }
.page-header h2 { font-size: 18px !important; }
.page-header .subtitle { font-size: 11px; margin-top: 1px; }
.cycle-bar { padding: 10px 14px; margin-bottom: 12px; }
.cycle-bar label, .cycle-bar select { font-size: 12px; }
.kpi { padding: 12px 14px !important; }
.kpi .label { font-size: 10px; letter-spacing: 0.6px; }
.kpi .value { font-size: 21px !important; }
.kpi .sub { font-size: 11px; }
.card { padding: 12px !important; margin-bottom: 12px; }
.chart-card { padding: 12px !important; }
.chart-card h3 { font-size: 12px !important; margin-bottom: 8px !important; }
.chart-wrap { height: 220px !important; }
table { font-size: 12px; }
table th { padding: 6px 10px !important; font-size: 10px !important; }
table td { padding: 6px 10px !important; }
table tr.section-row td { padding: 6px 14px !important; font-size: 10px !important; }
table tr.grp-header td { padding: 6px 14px !important; font-size: 12px !important; }
table tr.detail-row td { padding-left: 26px !important; }
h3 { font-size: 13px !important; margin: 14px 0 6px !important; }
.kpi-grid { gap: 10px; }
.chart-grid { gap: 10px; }
.acc-grid { gap: 10px; }
.acc-card { padding: 10px 12px !important; }
.acc-card .acc-name { font-size: 10px; }
.acc-card .acc-bal { font-size: 17px; margin-top: 2px; }
.acc-card .acc-meta { font-size: 10px; }
.btn { padding: 6px 12px; font-size: 12px; }
.btn-sm { padding: 4px 9px; font-size: 11px; }
.main { padding: 16px 20px 40px !important; }
@media (max-width: 768px) { .main { padding: 10px !important; padding-top: 60px !important; } }
.top5-list li { padding: 6px 0; }
.top5-info .desc { font-size: 12px; }
.top5-info .meta { font-size: 10px; }
.top5-amt { font-size: 13px; }
.section-pill { font-size: 11px; }
/* Slice Bank: solid white cards, no blur, thin gray borders */
.kpi, .card, .chart-card, .acc-card {
  background: #FFFFFF !important;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: 1px solid #F0F0F0;
  box-shadow: none;
}
/* Slice hero numbers: bigger + bolder + true black */
.kpi .value { font-size: 28px !important; font-weight: 700 !important; color: #0F0F0F !important; letter-spacing: -0.5px !important; }
.kpi .label { font-size: 10px !important; color: #6B6B6B !important; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
.kpi .sub { font-size: 11px !important; color: #6B6B6B; }
.kpi { border-left: none !important; padding: 16px 18px !important; }
.acc-bal { font-size: 20px !important; font-weight: 700 !important; color: #0F0F0F !important; letter-spacing: -.3px; }
h1, h2, .page-header h2, .sidebar h1 { font-weight: 600; letter-spacing: -.3px; }
.kpi .value, table td.numeric, .acc-bal { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ---------------- LAYOUT ---------------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
/* ── TOP NAV (replaces sidebar) ── */
.sidebar {
  display: none; /* hidden — replaced by top-nav */
}
.top-nav {
  position: sticky; top: 0; z-index: 200;
  background: var(--grad-night);
  display: flex; align-items: center; gap: 0;
  padding: 0 16px; height: 52px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.top-nav::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: var(--grad-primary);
}
.top-nav-brand {
  font-size: 14px; font-weight: 700; color: white; white-space: nowrap;
  padding-right: 18px; margin-right: 6px;
  border-right: 1px solid rgba(255,255,255,.15);
  line-height: 1.2;
}
.top-nav-brand .sub { display: block; font-size: 10px; opacity: .6; font-weight: 400; }
.nav {
  display: flex; align-items: center; flex: 1; gap: 2px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav button {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  padding: 0 13px; height: 52px; background: none; border: none; border-bottom: 3px solid transparent;
  color: rgba(255,255,255,.7); cursor: pointer;
  font-size: 13px; font-weight: 500; transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.nav button:hover { color: white; background: rgba(255,255,255,.06); }
.nav button.active { color: white; border-bottom-color: #A78BFA; background: rgba(255,255,255,.08); }
.nav .icon { font-size: 15px; }
.top-nav-actions {
  display: flex; align-items: center; gap: 6px; margin-left: auto; padding-left: 10px;
  border-left: 1px solid rgba(255,255,255,.15); flex-shrink: 0;
}
.top-nav-actions button {
  background: none; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.8);
  padding: 5px 9px; border-radius: 6px; font-size: 11px; cursor: pointer; white-space: nowrap;
  transition: background .15s;
}
.top-nav-actions button:hover { background: rgba(255,255,255,.12); color: white; }

.main {
  flex: 1;
  padding: 24px 28px 60px;
  min-width: 0;
  overflow-x: hidden;
}

/* Mobile nav */
.mobile-header { display: none; }

/* ── MOBILE: bottom tab bar ── */
@media (max-width: 768px) {
  .top-nav { display: none; }

  /* ── Mobile header ── */
  .mobile-header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--navy); color: white; padding: 10px 16px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 999; box-shadow: var(--shadow);
    height: 50px;
  }
  .mobile-header h1 { font-size: 14px; font-weight: 700; }

  /* ── Bottom tab bar ── */
  .bottom-tab-bar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
    background: var(--grad-night); border-top: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 -2px 10px rgba(0,0,0,.2);
    padding-bottom: env(safe-area-inset-bottom); /* iPhone notch support */
  }
  .bottom-tab-bar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 8px 2px; background: none; border: none; border-top: 2px solid transparent;
    color: rgba(255,255,255,.55); cursor: pointer; font-size: 9px; font-weight: 600;
    transition: color .15s, border-color .15s; min-width: 0;
  }
  .bottom-tab-bar button .icon { font-size: 20px; }
  .bottom-tab-bar button.active { color: white; border-top-color: #A78BFA; }
  .bottom-tab-bar button span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  /* ── Main content ── */
  .main { padding: 8px 10px 90px; padding-top: 58px; }

  /* ── KPI grid: 2 columns on phone ── */
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .label { font-size: 10px; }
  .kpi .value { font-size: 18px; }
  .kpi .sub { font-size: 10px; }

  /* ── Page header: stack title and buttons ── */
  .page-header { flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .page-header h2 { font-size: 18px; }
  .page-header > div:last-child { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ── Tables: horizontal scroll with touch ── */
  .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { font-size: 12px; min-width: 500px; }
  table th, table td { padding: 8px 8px; }
  /* Budget table: hide variance % column on phone (redundant with ₹ variance) */
  table th:last-child, table td:last-child { display: none; }

  /* ── Forms: full-width inputs, bigger tap targets ── */
  .form-grid { grid-template-columns: 1fr; gap: 10px; }
  input, select, textarea { font-size: 16px !important; /* prevents iOS zoom */ padding: 10px 12px; }

  /* ── Modal: full screen on phone ── */
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    width: 100%; max-width: 100%; max-height: 92vh;
    border-radius: 16px 16px 0 0; overflow-y: auto;
    padding: 20px 16px 32px;
  }

  /* ── Charts: shorter on phone ── */
  .chart-wrap { height: 200px !important; }
  .chart-grid { grid-template-columns: 1fr; }

  /* ── Account cards: single column ── */
  .acc-grid { grid-template-columns: 1fr; }

  /* ── FAB: above bottom tab bar ── */
  .fab { bottom: 72px; right: 16px; width: 52px; height: 52px; font-size: 22px; }

  /* ── Filters bar: stack vertically ── */
  .filters { flex-direction: column; gap: 8px; }
  .filters .form-group { min-width: unset; width: 100%; }

  /* ── Cycle bar ── */
  .cycle-bar { flex-wrap: wrap; gap: 8px; }
}

/* ── Very small phones (< 380px) ── */
@media (max-width: 380px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .kpi .value { font-size: 16px; }
}

/* ---------------- COMMON ---------------- */
.view { display: none; }
.view.active { display: block; }

.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
}
.page-header h2 { font-size: 22px; font-weight: 700; color: var(--grey-900); letter-spacing: -.3px; }
.page-header .subtitle { font-size: 12px; color: var(--grey-500); margin-top: 2px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all .15s; text-decoration: none;
}
.btn-primary { background: var(--navy); color: white; }
.btn-primary:hover { background: var(--navy-dark); }
.btn-success { background: var(--green); color: white; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--red); color: white; }
.btn-secondary { background: white; color: var(--grey-700); border: 1px solid var(--grey-300); }
.btn-secondary:hover { background: var(--grey-100); }
.btn-ghost { background: transparent; color: var(--grey-700); padding: 6px 8px; }
.btn-ghost:hover { background: var(--grey-100); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.card {
  background: white; border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px;
}

.row { display: flex; flex-wrap: wrap; gap: 14px; }
.row > * { flex: 1; min-width: 220px; }

select, input, textarea {
  font-family: inherit; font-size: 13px; padding: 8px 10px;
  border: 1px solid var(--grey-300); border-radius: 7px; background: white;
  color: var(--grey-900); width: 100%;
}
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(31,58,95,.1); }
label { font-size: 12px; font-weight: 600; color: var(--grey-700); margin-bottom: 4px; display: block; }
.form-group { margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
table th {
  text-align: left; background: white; color: var(--grey-500);
  padding: 10px 12px; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--grey-300);
}
table td { padding: 10px 12px; border-bottom: 1px solid var(--grey-200); color: var(--grey-900); background: white; }
table tr:nth-child(even) td { background: white; }  /* no zebra */
table tr:hover td { background: var(--grey-100); }
table th:first-child, table td:first-child { padding-left: 16px; }
.numeric { text-align: right; font-variant-numeric: tabular-nums; }
.center { text-align: center; }

.section-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 0; font-size: 12px; font-weight: 500;
  background: transparent; color: var(--grey-700);
  white-space: nowrap;
}
.section-pill::before {
  content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--grey-400);
}
/* Per-section dot colors only — text stays neutral, table stays clean */
.section-Income::before    { background: #16A34A; }
.section-Mumbai::before    { background: #475569; }
.section-Indore::before    { background: #64748B; }
.section-Family::before    { background: #7C3AED; }
.section-Liabilities::before { background: #92400E; }
.section-Insurance::before { background: #DC2626; }
.section-Tax::before       { background: #334155; }
.section-Charity::before   { background: #15803D; }
.section-Misc::before      { background: #94A3B8; }
.section-Savings::before   { background: #1E40AF; }

/* KPI Cards */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.kpi {
  background: white; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  border-left: 4px solid var(--navy); display: flex; flex-direction: column; gap: 4px;
  position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s;
}
.kpi:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.kpi.green { border-left-color: var(--green); }
.kpi.red   { border-left-color: var(--red); }
.kpi.navy  { border-left-color: var(--navy); }
.kpi.amber { border-left-color: var(--amber); }
.kpi .label { font-size: 11px; font-weight: 600; color: var(--grey-500); text-transform: uppercase; letter-spacing: 0.6px; }
.kpi .value { font-size: 26px; font-weight: 700; color: var(--grey-900); font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
.kpi .sub   { font-size: 12px; color: var(--grey-500); }
.kpi .delta-pos { color: var(--green); font-weight: 600; }
.kpi .delta-neg { color: var(--red); font-weight: 600; }

/* Account chips */
.acc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.acc-card {
  background: white; border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
  border: 1px solid var(--grey-200); position: relative;
}
.acc-card .acc-name { font-size: 12px; font-weight: 600; color: var(--grey-500); text-transform: uppercase; letter-spacing: .4px; }
.acc-card .acc-bal  { font-size: 20px; font-weight: 700; color: var(--navy); margin-top: 4px; font-variant-numeric: tabular-nums; }
.acc-card .acc-meta { font-size: 11px; color: var(--grey-400); margin-top: 4px; }
.acc-card.bank   { border-top: 3px solid var(--navy); }
.acc-card.credit { border-top: 3px solid var(--red); }
.acc-card.cash   { border-top: 3px solid var(--amber); }

/* Variance coloring */
.var-good { color: var(--green); font-weight: 600; }
.var-bad  { color: var(--red); font-weight: 600; }
.var-zero { color: var(--grey-500); }

/* Progress bar */
.bar { height: 6px; background: var(--grey-200); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > span { display: block; height: 100%; background: var(--green); transition: width .3s; }
.bar > span.over { background: var(--red); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 2000; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white; border-radius: var(--radius); padding: 22px;
  max-width: 520px; width: 100%; max-height: 92vh; overflow-y: auto;
  box-shadow: var(--shadow-md);
}
.modal h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 14px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--navy); color: white;
  padding: 12px 18px; border-radius: 8px; box-shadow: var(--shadow-md); z-index: 3000;
  font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; transform: translateY(10px);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* Cycle selector */
.cycle-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
  background: white; padding: 14px 18px; border-radius: var(--radius); box-shadow: var(--shadow);
}
.cycle-bar label { margin: 0; font-size: 13px; color: var(--navy); font-weight: 700; }
.cycle-bar select { width: auto; min-width: 160px; font-weight: 600; color: var(--navy); }
.cycle-bar .window { color: var(--grey-500); font-size: 12px; }
.cycle-bar .today { margin-left: auto; color: var(--grey-500); font-size: 12px; }

/* Charts */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
.chart-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.chart-card h3 { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
.chart-wrap { position: relative; height: 280px; }

/* Section dividers in budget table */
table tr.section-row td { background: var(--navy) !important; color: white; font-weight: 700; padding: 6px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
table tr.subtotal-row td { background: var(--grey-100) !important; font-weight: 700; border-top: 2px solid var(--grey-300); }

/* Section group header (mid-tier, lighter than super-cat) */
table tr.grp-header { cursor: pointer; user-select: none; }
table tr.grp-header td {
  background: rgba(232, 223, 196, 0.4) !important;  /* very light tan */
  color: var(--grey-900);
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 700;  /* bold for section header */
}
table tr.grp-header:hover td { background: rgba(232, 223, 196, 0.65) !important; }
table tr.grp-header td.var-good { color: var(--green) !important; }
table tr.grp-header td.var-bad  { color: var(--red) !important; }
.grp-toggle { display: inline-block; width: 14px; color: var(--grey-700); margin-right: 6px; font-size: 11px; }
.grp-add { background: rgba(74,124,89,.10); color: var(--navy); border: 1px solid rgba(74,124,89,.25); padding: 2px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; margin-left: 12px; font-weight: 600; }
.grp-add:hover { background: rgba(74,124,89,.20); }

/* Detail rows (sub-category, lightest tier — light font) */
table tr.detail-row td {
  padding-left: 32px;
  color: var(--grey-700);
  font-weight: 400;
  font-size: 13px;
}
table tr.detail-row td:first-child { padding-left: 16px; }
table tr.detail-row td.numeric {
  color: var(--grey-700);
  font-weight: 500;  /* numbers slightly bolder than text but still light */
}

/* Excel-like compact mode for Transactions table */
table.tx-compact { font-size: 11px; }

/* Empty state */

}

/* Top 5 list */
.top5-list { list-style: none; }
.top5-list li {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;

}
.top5-list li:last-child { border-bottom: none; }
.top5-rank {
  width: 28px; height: 28px; border-radius: 50%; background: var(--grey-100);
  color: var(--navy); font-weight: 700; display: flex; align-items: center; justify-content: center;

}
.top5-rank.gold   { background: #FEF3C7; color: #B45309; }
.top5-rank.silver { background: var(--grey-200); color: var(--grey-700); }
.top5-rank.bronze { background: #FED7AA; color: #9A3412; }

/* Filters */

  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: end;

/* Float action button */
.fab {
  display: none; position: fixed; bottom: 24px; right: 24px;

/* Lock screen */

let collapsedSections = {};

try { collapsedSections = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch(e) {}

// ---------- Cycle math ----------
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FY_MONTHS = [
  [2026,3],[2026,4],[2026,5],[2026,6],[2026,7],[2026,8],
  [2026,9],[2026,10],[2026,11],[2027,0],[2027,1],[2027,2],  // 0-indexed: Apr26..Mar27
];
function getCycles() {
  return FY_MONTHS.map(([y,m]) => {
    const start = new Date(y, m, 25);
    const end = new Date(m===11 ? y+1 : y, (m+1)%12, 24);
    return { name: `${MONTH_NAMES[m]} ${y}`, start, end };
  });
}
function getCycleForDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  // Cycle is named after the start month: 25th onwards = current month, 1-24 = previous month
  if (d.getDate() >= 25) {
    return `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  } else {
    const prev = new Date(d.getFullYear(), d.getMonth()-1, 1);
    return `${MONTH_NAMES[prev.getMonth()]} ${prev.getFullYear()}`;
  }
}
function currentCycleName() {
  return getCycleForDate(new Date().toISOString().slice(0,10));
}

// ---------- Utils ----------
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function fmtINR(n, opts={}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Math.round(n));
  // Indian numbering: 1,23,456
  let s = abs.toString();
  let result = '';
  if (s.length > 3) {
    const last3 = s.slice(-3);
    let rest = s.slice(0, -3);
    let parts = [];
    while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0,-2); }
    if (rest.length) parts.unshift(rest);
    result = parts.join(',') + ',' + last3;
  } else { result = s; }
  return (opts.noSym ? '' : '₹') + sign + result;
}
function fmtPct(n) {
  if (n === null || !isFinite(n)) return '—';
  const s = (n*100).toFixed(1) + '%';
  return n > 0 ? '+' + s : s;
}
function fmtDate(d) {
  if (!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return '';
  const day = String(dt.getDate()).padStart(2,'0');
  return `${day}-${MONTH_NAMES[dt.getMonth()]}-${dt.getFullYear()}`;
}
function todayISO() { return new Date().toISOString().slice(0,10); }

      state.budget.forEach(b => { if (b.section==='Mumbai' && b.subcategory==='Misc Living') b.subcategory='Misc'; });

      ['Food / Grocery','Transport','Cab / Auto'].forEach(name => {
        if (!state.budget.some(b => b.section==='Mumbai' && b.subcategory===name)) {
          state.budget.push({ section:'Mumbai', subcategory:name, monthly:0, notes:'' });

      });
      // Migration v3: ensure each account has openingBalance field
      state.accounts.forEach(a => { if (a.openingBalance === undefined) a.openingBalance = 0; });
      // Migration: deduplicate state.balances — keep only the most recent entry per account
      if (Array.isArray(state.balances) && state.balances.length) {
        const latest = {};
        state.balances.forEach(b => {
          if (!latest[b.account] || b.date > latest[b.account].date) latest[b.account] = b;
        });
        state.balances = Object.values(latest);
      }
      // Migration: load wealthItems and wealthRecons
      state.wealthItems  = parsed.wealthItems  || [];
      state.wealthRecons = parsed.wealthRecons || [];
      // Migration: ensure each wealthItem has openingBalance (backfill from value for old entries)
      state.wealthItems.forEach(w => { if (w.openingBalance === undefined) w.openingBalance = Number(w.value)||0; });
      // Migration v4: customizable sections list
      if (!Array.isArray(state.sections) || !state.sections.length) {
        const fromBudget = [];
        state.budget.forEach(b => { if (b.section && !fromBudget.includes(b.section)) fromBudget.push(b.section); });
        state.sections = fromBudget.length ? fromBudget : [...DEFAULT_SECTIONS];
        RESERVED_SECTIONS.forEach(s => { if (!state.sections.includes(s)) state.sections.push(s); });

      // Migration v6: split Savings into Personal + Corporate/Retirement
      // Rename existing 'Savings' section to 'Personal Savings'

        const idx = state.sections.indexOf('Savings');
        state.sections[idx] = 'Personal Savings';
        state.budget.forEach(b => { if (b.section === 'Savings') b.section = 'Personal Savings'; });
        state.transactions.forEach(t => { if (t.section === 'Savings') t.section = 'Personal Savings'; });
      }
      // Add Corporate / Retirement Savings section if missing
      if (!state.sections.includes('Corporate / Retirement Savings')) {
        // Insert after Personal Savings (or append at end)
        const idx = state.sections.indexOf('Personal Savings');
        if (idx >= 0) state.sections.splice(idx + 1, 0, 'Corporate / Retirement Savings');

          { section:'Corporate / Retirement Savings', subcategory:'Corporate NPS',  monthly:13000, notes:'Employer-managed NPS contribution' },
          { section:'Corporate / Retirement Savings', subcategory:'EPF / PF',       monthly:0,     notes:'Employee + employer EPF (auto-deducted)' },
          { section:'Corporate / Retirement Savings', subcategory:'Gratuity',       monthly:0,     notes:'Informational; paid on exit' },
        );
      }
      // Migration v5: add Tax section + default Tax sub-categories if absent
      if (!state.sections.includes('Tax')) {
        const insertIdx = state.sections.indexOf('Charity');
        if (insertIdx >= 0) state.sections.splice(insertIdx, 0, 'Tax');
        else state.sections.push('Tax');
      }
      if (!state.budget.some(b => b.section === 'Tax')) {
        state.budget.push(
          { section:'Tax', subcategory:'Advance Tax',         monthly:0, notes:'Quarterly: 15-Jun / 15-Sep / 15-Dec / 15-Mar' },
          { section:'Tax', subcategory:'Self-Assessment Tax', monthly:0, notes:'When filing ITR (Jul-Sep)' },
          { section:'Tax', subcategory:'Capital Gains Tax',   monthly:0, notes:'On stock / MF / property sales' },
          { section:'Tax', subcategory:'Property Tax',        monthly:0, notes:'BMC / municipal — annual or half-yearly' },
          { section:'Tax', subcategory:'Professional Tax',    monthly:0, notes:'State professional tax if applicable' },
          { section:'Tax', subcategory:'Other Tax',           monthly:0, notes:'GST self-paid, road tax, late fees etc.' },
        );
      }
      SECTIONS = [...state.sections];
    } else {
      state.budget       = JSON.parse(JSON.stringify(DEFAULT_BUDGET));
      state.accounts     = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
      state.transactions = JSON.parse(JSON.stringify(SAMPLE_TRANSACTIONS)).map(t => ({...t, id:uid()}));
      state.balances     = JSON.parse(JSON.stringify(SAMPLE_BALANCES)).map(b => ({...b, id:uid()}));
      state.selectedCycle = currentCycleName();
      state.sections     = [...DEFAULT_SECTIONS];
      SECTIONS = [...state.sections];
      saveState();
    }
  } catch(e) {
    console.error('Failed to load state:', e);
    state.budget   = JSON.parse(JSON.stringify(DEFAULT_BUDGET));
    state.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
    state.transactions = [];
    state.balances = [];
    state.selectedCycle = currentCycleName();
  }
}
// Save: writes to Firestore (debounced) if signed in, else localStorage as fallback
let _saveTimer = null;
function saveState() {
  // Strip computed fields before persisting (cycle is derived, not stored)
  const toSave = {
    budget:        state.budget        || [],
    transactions:  (state.transactions || []).map(({ cycle, ...rest }) => rest),
    accounts:      state.accounts      || [],
    balances:      state.balances      || [],
    wealthItems:   state.wealthItems   || [],
    wealthRecons:  state.wealthRecons  || [],
    sections:      state.sections      || [],
    selectedCycle: state.selectedCycle || '',
    _updatedAt:    new Date().toISOString(),
  };
  // Always mirror to localStorage as offline cache
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); } catch(e) {}
  // Push to Firestore if logged in (debounced)
  if (window._fbUser && window._fbDb) {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
      const docRef = window._fbDb.collection('users').doc(window._fbUser.uid).collection('state').doc('main');
      docRef.set(toSave)
        .then(() => showToast('✓ Saved (' + toSave.transactions.length + ' txns)'))
        .catch(e => { console.error('Cloud save failed:', e); showToast('Cloud save failed: ' + e.message, 'error'); });
    }, 600);
  }
}
// ---------- Aggregations ----------
function txWithCycle(tx) { return { ...tx, cycle: getCycleForDate(tx.date) }; }
function txAll() { return state.transactions.map(txWithCycle); }

function actualByCycle(cycle, sectionFilter=null) {
  return txAll().filter(t => t.cycle === cycle && t.type !== 'transfer' && (!sectionFilter || sectionFilter(t.section)))
                .reduce((sum,t) => sum + (Number(t.amount)||0), 0);
}
function budgetTotal(sectionFilter=null) {
  return state.budget.filter(b => !sectionFilter || sectionFilter(b.section))
                     .reduce((sum,b) => sum + (Number(b.monthly)||0), 0);
}
function actualForBudgetRow(cycle, section, sub) {
  return txAll().filter(t => t.cycle===cycle && t.section===section && t.subcategory===sub)
                .reduce((sum,t) => sum + (Number(t.amount)||0), 0);
}
function topExpenses(cycle, n=5) {
  return txAll().filter(t => t.cycle===cycle && t.type!=='transfer' && t.section!=='Income' && (Number(t.amount)||0)>0)
                .sort((a,b) => b.amount - a.amount)
                .slice(0, n);
}
function categoryTotalsForCycle(cycle) {
  // Returns [{section, total}] for non-income sections (for pie chart)
  const totals = {};
  txAll().filter(t => t.cycle===cycle && t.type!=='transfer' && t.section!=='Income')
         .forEach(t => { totals[t.section] = (totals[t.section]||0) + (Number(t.amount)||0); });
  return Object.entries(totals).map(([section,total]) => ({section, total}))
                               .filter(x => x.total > 0)
                               .sort((a,b) => b.total - a.total);
}
function trendByCycle() {
  const cycles = getCycles();
  return cycles.map(c => ({
    cycle: c.name,
    income:  actualByCycle(c.name, s => s==='Income'),
    expense: actualByCycle(c.name, s => s!=='Income' && !isSavSec(s)),
    savings: actualByCycle(c.name, s => isSavSec(s)),
  }));
}
function yearlyTotals() {
  // Annual budget vs actual per category (group by section + subcategory)
  return state.budget.map(b => {
    const annualBudget = (Number(b.monthly)||0) * 12;
    const actual = txAll().filter(t => t.section===b.section && t.subcategory===b.subcategory)
                          .reduce((s,t)=>s+(Number(t.amount)||0),0);
    const variance = actual - annualBudget;
    const pct = annualBudget !== 0 ? variance / annualBudget : null;
    return { ...b, annualBudget, actual, variance, pct };
  });
}
function latestBalanceFor(account) {
  const entries = state.balances.filter(b => b.account === account)
                                .sort((a,b) => b.date.localeCompare(a.date));
  return entries[0] || null;
}
// Auto-track: how a transaction changes a given account's balance
function txAffectAccount(t, accountName) {
  const amt = Number(t.amount) || 0;
  if (t.type === 'transfer') {
    if (t.fromAccount === accountName) return -amt;
    if (t.toAccount === accountName)   return +amt;
    return 0;
  }
  if (t.account !== accountName) return 0;
  return t.section === 'Income' ? amt : -amt;
}
// Computed balance = opening balance + ALL transactions up to asOf
// Reconciliation entries are NOT used as a base — they are only for recording actual vs computed.
// This means computed is always a pure function of (openingBalance + transactions).
function computedBalance(accountName, asOf=null) {
  const acc = state.accounts.find(a => a.name === accountName);
  if (!acc) return null;
  const asOfStr = asOf || todayISO();
  const baseBal = Number(acc.openingBalance) || 0;
  const delta = state.transactions
    .filter(t =>
      t.date <= asOfStr &&
      (t.account === accountName || t.fromAccount === accountName || t.toAccount === accountName)
    )
    .reduce((s,t) => s + txAffectAccount(t, accountName), 0);
  return baseBal + delta;
}
function balanceBasis(accountName) {
  // Returns { baseBal, baseDate, source: 'opening'|'reconcile' } for transparency in UI
  const acc = state.accounts.find(a => a.name === accountName);
  if (!acc) return null;
  const entries = state.balances
    .filter(b => b.account === accountName)
    .sort((a,b) => b.date.localeCompare(a.date));
  if (entries.length) return { baseBal: Number(entries[0].balance)||0, baseDate: entries[0].date, source:'reconcile' };
  return { baseBal: Number(acc.openingBalance)||0, baseDate: null, source:'opening' };
}

// 3 super-cat pies: each shows sub-categories breakdown for that super-cat (Income/Expenses/Savings)
let _superCatCharts = { income:null, expense:null, savings:null };
function drawSuperCatPies(cycle) {
  const buildData = (filterFn) => {
    const data = {};
    SECTIONS.filter(filterFn).forEach(sec => {
      state.budget.filter(b => b.section === sec).forEach(b => {
        const actual = actualForBudgetRow(cycle, sec, b.subcategory);
        if (actual > 0) data[b.subcategory] = (data[b.subcategory]||0) + actual;
      });
    });
    return Object.entries(data).sort((a,b) => b[1]-a[1]);
  };
  const renderPie = (canvasId, title, entries, totalBudget) => {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    const totalActual = entries.reduce((s,[,v]) => s+v, 0);
    const labels = entries.map(([k]) => k);
    const values = entries.map(([,v]) => v);
    const colors = entries.map((_,i) => CHART_PALETTE[i % CHART_PALETTE.length]);
    if (!entries.length) {
      const c = ctx.getContext('2d');
      c.clearRect(0,0,ctx.width,ctx.height);
      c.font = '12px ' + FONT.family;
      c.fillStyle = 'rgba(139,132,112,0.6)';
      c.textAlign = 'center';
      c.fillText('No actuals yet', ctx.width/2, ctx.height/2 - 8);
      c.fillText(`Budget: ${fmtINR(totalBudget)}`, ctx.width/2, ctx.height/2 + 10);
      return null;
    }
    return new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: 'rgba(255,255,255,.7)' }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '60%',
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 6 } },
          tooltip: { callbacks: { label: (c) => {
            const pct = (c.parsed/totalActual*100).toFixed(1);
            return `${c.label}: ${fmtINR(c.parsed)} (${pct}%)`;
          }}},
          title: { display: true, text: `Actual ${fmtINR(totalActual)} / Budget ${fmtINR(totalBudget)}`, font: { size: 11, weight: '500' }, color: '#5A5440', padding: { top: 0, bottom: 8 } }
        }
      }
    });
  };
  // Income
  if (_superCatCharts.income) _superCatCharts.income.destroy();
  const incBud = SECTIONS.filter(s => superCatOf(s)==='Income')

function cycleProgressPct(cycleName) {
  const c = getCycles().find(x => x.name === cycleName);
  if (!c) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  if (today < c.start) return 0;
  if (today > c.end) return 100;
  const total = (c.end - c.start) / 86400000 + 1;
  const done = (today - c.start) / 86400000 + 1;
  return Math.round(done/total*100);
}
function cycleDaysElapsed(cycleName) {
  const c = getCycles().find(x => x.name === cycleName);
  if (!c) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  if (today < c.start) return 'Cycle starts ' + fmtDate(c.start);
  if (today > c.end) return 'Cycle ended ' + fmtDate(c.end);
  const done = Math.floor((today - c.start) / 86400000) + 1;
  const total = Math.floor((c.end - c.start) / 86400000) + 1;
  return `Day ${done} of ${total}`;
}

function applyTxFilters(arr) {
  const q = (txFilter.search||'').toLowerCase();
  return arr.filter(t =>
    (!txFilter.cycle || t.cycle===txFilter.cycle) &&
    (!txFilter.section || t.section===txFilter.section) &&
    (!txFilter.sub || t.subcategory===txFilter.sub) &&
    (!txFilter.account || t.account===txFilter.account || t.fromAccount===txFilter.account || t.toAccount===txFilter.account) &&
    (!txFilter.vendor || t.tag===txFilter.vendor) &&
    (!q || (t.description||'').toLowerCase().includes(q) || (t.tag||'').toLowerCase().includes(q) || (t.subcategory||'').toLowerCase().includes(q))
  );
}

function rebuildSummary(filtered, totalTx) {
  const el = document.getElementById('txSummary');
  if (!el) return;
  const expSum = filtered.filter(t => t.type!=='transfer' && t.section!=='Income').reduce((s,t)=>s+(Number(t.amount)||0),0);
  const incSum = filtered.filter(t => t.type!=='transfer' && t.section==='Income').reduce((s,t)=>s+(Number(t.amount)||0),0);
  el.innerHTML = `${totalTx} total entries  •  ${filtered.length} shown  •  Outflows: ${fmtINR(expSum)}  •  Inflows: ${fmtINR(incSum)}`;
}
function renderTransactionsTable() {
  const all = txAll();
  let filtered = applyTxFilters(all);
  // Sync vendor boxes + summary to current filter
  rebuildVendorBoxes(filtered);
  rebuildSummary(filtered, all.length);
  // Sort
  const accessors = {
    date:        t => t.date || '',
    description: t => (t.description||'').toLowerCase(),
    section:     t => t.type==='transfer' ? 'Transfer' : (t.section||''),
    subcategory: t => t.type==='transfer' ? `${t.fromAccount||''} → ${t.toAccount||''}` : (t.subcategory||''),
    tag:         t => (t.tag||'').toLowerCase(),
    paymentMode: t => t.paymentMode||'',
    account:     t => t.type==='transfer' ? `${t.fromAccount||''}/${t.toAccount||''}` : (t.account||''),
    cycle:       t => t.cycle||'',
    debit:       t => txDebit(t),
    credit:      t => txCredit(t),
    net:         t => txNet(t),
  };
  const get = accessors[txSort.col] || accessors.date;
  filtered.sort((a,b) => {
    const av=get(a), bv=get(b);
    if (av < bv) return txSort.dir==='asc' ? -1 : 1;
    if (av > bv) return txSort.dir==='asc' ?  1 : -1;
    return 0;
  });

  const arrow = c => txSort.col===c ? (txSort.dir==='asc'?' ▲':' ▼') : '';
  const th = (col,label,cls='') => `<th class="${cls}" style="cursor:pointer;user-select:none;" onclick="setTxSort('${col}')">${label}${arrow(col)}</th>`;

  const rows = filtered.length ? filtered.map(t => {
    const dr = txDebit(t), cr = txCredit(t), net = txNet(t);
    if (t.type === 'transfer') {
      return `<tr style="background:var(--blue-soft) !important;">
        <td>${fmtDate(t.date)}</td>
        <td>${escapeHTML(t.description||'')}</td>
        <td><span class="section-pill" style="background:var(--blue-text);color:white;">Transfer</span></td>
        <td>${escapeHTML(t.fromAccount||'')} → ${escapeHTML(t.toAccount||'')}</td>
        <td>—</td>
        <td>—</td>
        <td>—</td>
        <td>${escapeHTML(t.cycle||'')}</td>
        <td class="numeric">${dr?fmtINR(dr):'—'}</td>
        <td class="numeric">${cr?fmtINR(cr):'—'}</td>
        <td class="numeric var-zero">—</td>
        <td class="center">
          <button class="btn-ghost btn-sm" onclick="openTransactionModal('${t.id}')" title="Edit">✎</button>
          <button class="btn-ghost btn-sm" onclick="deleteTransaction('${t.id}')" title="Delete" style="color:var(--red);">✕</button>
        </td>
      </tr>`;
    }
    const netCls = net>0?'var-good':net<0?'var-bad':'var-zero';
    const wi = t.wealthImpact;
    const wiBadge = wi ? `<span title="Wealth impact: ${wi.dir==='reduce'?'Reduced':'Increased'} ${escapeHTML(wi.itemName||'')} by ${fmtINR(wi.amt)}" style="display:inline-block;background:var(--amber);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:100px;margin-left:4px;vertical-align:middle;cursor:default;">⚡ ${escapeHTML(wi.itemName||'')}</span>` : '';
    return `<tr style="${wi?'background:var(--amber-soft) !important;':''}">
      <td>${fmtDate(t.date)}</td>
      <td>${escapeHTML(t.description||'')}${wiBadge}</td>
      <td><span class="section-pill section-${t.section}">${t.section}</span></td>
      <td>${escapeHTML(t.subcategory||'')}</td>
      <td>${t.tag && t.tag!=='Other' ? `<span style="background:#F0EFFE;color:#5E5DCD;padding:1px 7px;border-radius:100px;font-size:10px;font-weight:600;cursor:pointer;" onclick="txFilter.vendor='${escapeHTML(t.tag).replace(/'/g,"\\'")}';document.getElementById('ftVendor').value='${escapeHTML(t.tag).replace(/'/g,"\\'")}';renderTransactionsTable();">${escapeHTML(t.tag)}</span>` : '<span style="color:var(--grey-400);font-size:10px;">—</span>'}</td>
      <td>${escapeHTML(t.paymentMode||'')}</td>
      <td>${escapeHTML(t.account||'')}</td>
      <td>${escapeHTML(t.cycle||'')}</td>
      <td class="numeric">${dr?fmtINR(dr):'—'}</td>
      <td class="numeric">${cr?fmtINR(cr):'—'}</td>
      <td class="numeric ${netCls}">${net===0?'—':fmtINR(net)}</td>
      <td class="center">
        <button class="btn-ghost btn-sm" onclick="openTransactionModal('${t.id}')" title="Edit">✎</button>
        <button class="btn-ghost btn-sm" onclick="deleteTransaction('${t.id}')" title="Delete" style="color:var(--red);">✕</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="12" class="empty">No transactions match your filters</td></tr>`;

  // Totals (excluding transfers)
  const regulars = filtered.filter(t => t.type !== 'transfer');
  const totalDr = regulars.reduce((s,t) => s + txDebit(t), 0);
  const totalCr = regulars.reduce((s,t) => s + txCredit(t), 0);
  const totalNet = totalCr - totalDr;
  const totNetCls = totalNet>0?'var-good':totalNet<0?'var-bad':'var-zero';
  const totalRow = filtered.length ? `<tr class="subtotal-row">
    <td colspan="8" style="text-align:right;font-weight:700;">TOTAL (excl. transfers)</td>
    <td class="numeric">${fmtINR(totalDr)}</td>
    <td class="numeric">${fmtINR(totalCr)}</td>
    <td class="numeric ${totNetCls}">${fmtINR(totalNet)}</td>
    <td></td>
  </tr>` : '';

  document.getElementById('txTable').innerHTML = `
    <thead><tr>
      ${th('date','Date')}
      ${th('description','Description')}
      ${th('section','Section')}
      ${th('subcategory','Sub-Category')}
      ${th('tag','Vendor')}
      ${th('paymentMode','Payment')}
      ${th('account','Account')}
      ${th('cycle','Cycle')}
      ${th('debit','Debit (Expense)','numeric')}
      ${th('credit','Credit (Income)','numeric')}
      ${th('net','Net','numeric')}
      <th class="center">Actions</th>
    </tr></thead>
    <tbody>${rows}${totalRow}</tbody>`;
}

// ---------- Render: Accounts ----------
function renderAccounts() {
  // Compute summary totals — assets vs liabilities
  const isLiability = (a) => a.type === 'credit' || a.type === 'loan' || a.type === 'liability';
  const totalAssets = state.accounts.filter(a => !isLiability(a))
    .reduce((s,a) => s + (computedBalance(a.name)||0), 0);
  const totalCredit = state.accounts.filter(a => isLiability(a))
    .reduce((s,a) => s + (computedBalance(a.name)||0), 0);

  const balCards = state.accounts.map((a,idx) => {
    const bal = computedBalance(a.name);
    const basis = balanceBasis(a.name);
    const meta = basis.source === 'reconcile'
      ? `Auto-tracked since reconciliation on ${fmtDate(basis.baseDate)} at ${fmtINR(basis.baseBal)}`
      : `Auto-tracked from opening balance`;
    const negNote = a.type==='credit' ? '<div class="acc-meta" style="color:var(--red);font-size:11px;">Negative = outstanding owed</div>' : '';
    return `<div class="acc-card ${a.type}">
      <div class="acc-name">${escapeHTML(a.name)}</div>
      <div class="acc-bal">${fmtINR(bal)}</div>
      <div class="acc-meta">${meta}</div>
      ${negNote}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="openOpeningBalanceModal(${idx})" title="Edit opening balance">Opening: ${fmtINR(a.openingBalance||0)} ✎</button>
        <button class="btn btn-secondary btn-sm" onclick="openReconcileModal('${escapeHTML(a.name).replace(/'/g,"\\'")}')">Reconcile</button>
        <button class="btn-ghost btn-sm" onclick="deleteAccount(${idx})" title="Delete account" style="color:var(--red);">✕</button>
      </div>
    </div>`;
  }).join('');

  // Reconciliation history
  const sorted = [...state.balances].sort((a,b) => b.date.localeCompare(a.date) || (b.id||'').localeCompare(a.id||''));
  const histRows = sorted.length ? sorted.map(b => {
    const computedAtDate = computedBalance(b.account, b.date);
    return `<tr>
      <td>${fmtDate(b.date)}</td>
      <td>${escapeHTML(b.account)}</td>
      <td class="numeric" style="font-weight:700;color:var(--navy);">${fmtINR(computedAtDate)}</td>
      <td style="color:var(--grey-500);font-size:12px;">${escapeHTML(b.note||'—')}</td>
      <td class="center">
        <button class="btn-ghost btn-sm" onclick="deleteBalance('${b.id}')" style="color:var(--red);">✕</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="empty">No reconciliation entries yet</td></tr>`;

  document.getElementById('view-accounts').innerHTML = `
    <div class="page-header">
      <div>
        <h2>Accounts &amp; Balances</h2>
        <div class="subtitle">Auto-tracked from opening balance + every transaction. Reconcile when your real balance differs.</div>
      </div>
      <div>
        <button class="btn btn-secondary btn-sm" onclick="openAddAccountModal()">+ Add Account</button>
        <button class="btn btn-success" onclick="openReconcileModal()">+ Reconcile Balance</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi green">
        <span class="label">Total Liquid Assets</span>
        <span class="value">${fmtINR(totalAssets)}</span>
        <span class="sub">Bank + Cash combined</span>
      </div>
      <div class="kpi red">
        <span class="label">Credit Card Outstanding</span>
        <span class="value">${fmtINR(-totalCredit)}</span>
        <span class="sub">${totalCredit < 0 ? 'Amount owed' : 'No outstanding'}</span>
      </div>
      <div class="kpi navy">
        <span class="label">Net Worth (Liquid)</span>
        <span class="value">${fmtINR(totalAssets + totalCredit)}</span>
        <span class="sub">Assets − Credit outstanding</span>
      </div>
    </div>

    <h3 style="margin:18px 0 10px;color:var(--navy);font-size:15px;">Per-Account Auto Balance</h3>
    <div class="acc-grid">${balCards}</div>

    <div class="card" style="margin-top:8px;padding:14px;background:#FFFBEB;border-left:4px solid var(--amber);">
      <strong style="color:#92400E;font-size:13px;">How auto-tracking works</strong>
      <p style="font-size:12px;color:var(--grey-700);margin-top:6px;line-height:1.6;">
        Set an <strong>Opening Balance</strong> per account once (click ✎ on any account card). Every transaction tagged with that account auto-adjusts the balance — Income adds, Expense/Savings subtract.
        <br>When your actual bank/SMS balance differs from what's shown, click <strong>Reconcile</strong> — the entry resets the basis from that date forward, and the table below shows any gap (could be a missed transaction or a fee).
        <br><strong>Credit Card</strong>: spends decrease balance (more negative = more owed). Paying the bill from another account → log as a normal transaction with account = "Credit Card" and section "Misc/Buffer" (or create a "Transfer" sub-category).
      </p>
    </div>

    <h3 style="margin:18px 0 10px;color:var(--navy);font-size:15px;">Account Balance Tracker</h3>
    <p style="font-size:12px;color:var(--grey-500);margin-bottom:8px;">
      Computed = opening ± all transactions. Actual = what your passbook says. Diff = gap to investigate.
    </p>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr>
          <th>Account</th>
          <th class="numeric">Computed</th>
          <th class="numeric">Actual (last recon)</th>
          <th class="numeric">Diff</th>
          <th class="center">Reconciled On</th>
          <th class="center">Days Ago</th>
          <th class="center">Action</th>
        </tr></thead>
        <tbody>
          ${state.accounts.map(a => {
            const live = computedBalance(a.name);
            const basis = balanceBasis(a.name);
            let daysAgo = '—', daysCls = 'var-zero';
            let actualCell = '<span style="color:var(--grey-400)">—</span>';
            let diffCell = '<span style="color:var(--grey-400)">—</span>';
            if (basis.source === 'reconcile' && basis.baseDate) {
              const d = Math.floor((new Date() - new Date(basis.baseDate)) / 86400000);
              daysAgo = d + ' days';
              daysCls = d < 7 ? 'var-good' : d < 14 ? 'var-zero' : 'var-bad';
              // Get the stored actual balance and diff from the reconciliation entry
              const reconEntry = (state.balances||[]).find(b => b.account === a.name);
              if (reconEntry) {
                actualCell = `<span style="font-weight:700;">${fmtINR(reconEntry.balance)}</span>`;
                const diff = reconEntry.diff ?? (reconEntry.balance - (reconEntry.computed || 0));
                const diffRounded = Math.round(diff);
                const diffCls = Math.abs(diffRounded) < 1 ? 'var-zero' : (diff < 0 ? 'var-bad' : 'var-good');
                diffCell = `<span class="${diffCls}" style="font-weight:700;">${Math.abs(diffRounded)<1 ? '✓ 0' : (diff>0?'+':'')+fmtINR(diff)}</span>`;
              }
            } else {
              daysAgo = 'never'; daysCls = 'var-bad';
            }
            return `<tr>
              <td><strong>${escapeHTML(a.name)}</strong> <span style="font-size:10px;color:var(--grey-400);text-transform:uppercase;">(${a.type})</span></td>
              <td class="numeric" style="font-weight:700;color:var(--navy);">${fmtINR(live)}</td>
              <td class="numeric">${actualCell}</td>
              <td class="numeric">${diffCell}</td>
              <td class="center">${basis.source === 'reconcile' ? fmtDate(basis.baseDate) : '<em style="color:var(--grey-400)">Not yet</em>'}</td>
              <td class="center ${daysCls}" style="font-weight:600;">${daysAgo}</td>
              <td class="center">
                <button class="btn btn-success btn-sm" onclick="openReconcileModal('${escapeHTML(a.name).replace(/'/g,"\\'")}')">Reconcile</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function prevDate(dateStr) {
  const d = new Date(dateStr);
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function saveNewAccount() {
  const fd = new FormData(document.getElementById('newAccForm'));
  const name = (fd.get('name')||'').trim();
  if (!name) { showToast('Name required', 'error'); return; }
  if (state.accounts.some(a => a.name === name)) { showToast('Account name already exists', 'error'); return; }
  state.accounts.push({ name, type: fd.get('type'), openingBalance: Number(fd.get('openingBalance'))||0 });

function deleteAccount(accIdx) {
  const a = state.accounts[accIdx];
  if (!a) return;
  const txCount = state.transactions.filter(t => t.account === a.name || t.fromAccount === a.name || t.toAccount === a.name).length;
  if (!confirm(`Delete account "${a.name}"?\n\n${txCount} transactions reference it (they'll keep their account name string but won't auto-track anymore). This cannot be undone.`)) return;
  state.accounts.splice(accIdx, 1);
  saveState(); refreshActiveView(); showToast(`Account "${a.name}" deleted`);
}

function updateReconComputed(accountName) {
  const comp = computedBalance(accountName) || 0;

  if (el) el.value = fmtINR(comp);

function updateReconDiff() {
  const balInput = document.querySelector('#balForm [name="balance"]');
  const compEl = document.getElementById('reconComputedDisplay');
  const diffEl = document.getElementById('reconDiffDisplay');
  if (!balInput || !compEl || !diffEl) return;
  const actual = parseFloat(balInput.value);
  const compText = compEl.value.replace(/[₹,\s]/g,'');
  const comp = parseFloat(compText) || 0;
  if (isNaN(actual)) { diffEl.value = '—'; diffEl.style.color = 'var(--grey-400)'; return; }
  const diff = actual - comp;
  diffEl.value = (diff >= 0 ? '+' : '') + fmtINR(diff);
  diffEl.style.color = Math.abs(diff) < 1 ? 'var(--grey-400)' : (diff < 0 ? 'var(--red)' : 'var(--green)');
}

// ---------- Render: Wealth & Assets ----------
let wealthCompChart = null, wealthTrendChart = null;
function renderWealth() {
  if (!Array.isArray(state.wealthItems))  state.wealthItems  = [];
  if (!Array.isArray(state.wealthRecons)) state.wealthRecons = [];
  // Capture filter values BEFORE rebuilding HTML (DOM gets wiped on re-render)
  const _wlhFilterItem  = document.getElementById('wlhFilterItem')?.value  || '';
  const _wlhFilterMonth = document.getElementById('wlhFilterMonth')?.value || '';

  const isLiabAcc = (a) => a.type === 'credit' || a.type === 'loan' || a.type === 'liability';
  const assetAccounts = state.accounts.filter(a => !isLiabAcc(a));
  const creditAccounts = state.accounts.filter(a => isLiabAcc(a));
  const totalAssets = assetAccounts.reduce((s,a) => s + (computedBalance(a.name)||0), 0);
  const totalCredit = creditAccounts.reduce((s,a) => s + (computedBalance(a.name)||0), 0);  // negative for liabilities
  // Manual wealth items (outside accounts): use computedWealthValue for accuracy
  const manualAssets = state.wealthItems.filter(w => w.type === 'asset')
    .reduce((s,w) => s + computedWealthValue(w.name), 0);
  const manualLiabs = state.wealthItems.filter(w => w.type === 'liability')
    .reduce((s,w) => s + computedWealthValue(w.name), 0);

  // Total Savings deployed YTD (sum of savings transactions, excluding transfers)
  const savingsTx = state.transactions.filter(t => t.type !== 'transfer' && isSavSec(t.section));
  const totalSavingsDeployed = savingsTx.reduce((s,t) => s + (Number(t.amount)||0), 0);

  const netWorth = totalAssets + totalCredit + manualAssets - manualLiabs + totalSavingsDeployed;

  // Per sub-category Savings deployment
  const subTotals = {};
  const subLatestDate = {};
  savingsTx.forEach(t => {
    const sub = t.subcategory || 'Other';
    subTotals[sub] = (subTotals[sub]||0) + (Number(t.amount)||0);
    if (!subLatestDate[sub] || t.date > subLatestDate[sub]) subLatestDate[sub] = t.date;
  });
  const subList = Object.entries(subTotals).map(([sub,total]) => ({sub, total, lastDate: subLatestDate[sub]}))
                                            .sort((a,b) => b.total - a.total);

  // Per cycle: cumulative savings deployed
  const cycles = getCycles();
  const cycleData = cycles.map(c => {
    const cycleSavings = savingsTx.filter(t => getCycleForDate(t.date) === c.name)
                                  .reduce((s,t) => s + (Number(t.amount)||0), 0);
    return { cycle: c.name, deployed: cycleSavings };
  });
  // Cumulative
  let cum = 0;
  const cumulative = cycleData.map(c => { cum += c.deployed; return { cycle: c.cycle, cumulative: cum, deployed: c.deployed }; });

  // Asset composition data (per account, current computed)
  const assetComposition = state.accounts.map(a => ({
    name: a.name,
    type: a.type,
    balance: computedBalance(a.name) || 0,
  })).filter(a => a.balance !== 0);

  // Build sub-category rows (Savings deployment table)
  const subRows = subList.length ? subList.map(s => {
    const monthsActive = Math.max(1, cycles.findIndex(c => c.name === currentCycleName()) + 1);
    const avgMonthly = s.total / monthsActive;
    return `<tr>
      <td><span class="section-pill section-Savings">Savings</span> ${escapeHTML(s.sub)}</td>
      <td class="numeric" style="font-weight:700;color:var(--blue-text);">${fmtINR(s.total)}</td>
      <td class="numeric">${fmtINR(avgMonthly)}</td>
      <td>${fmtDate(s.lastDate)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="empty">No Savings transactions logged yet</td></tr>`;

  document.getElementById('view-wealth').innerHTML = `
    <div class="page-header">
      <div>
        <h2>Wealth &amp; Assets</h2>
        <div class="subtitle">Real-time asset balances + cumulative savings deployment for FY 2026-27</div>
      </div>
    </div>

          <th>Last Reconciled</th>

          <th class="numeric">Δ Since Recon</th>

            let deltaCell = '<span class="var-zero">—</span>';
            if (basis.source === 'reconcile' && basis.date) {
              const d = Math.floor((new Date() - new Date(basis.date)) / 86400000);
              daysAgo = d + ' days';
              daysCls = d < 14 ? 'var-good' : d < 30 ? 'var-zero' : 'var-bad';
              const delta = Math.round((Number(live)||0) - (Number(basis.value)||0));

      Every change this year: opening balance, transaction impacts, and manual reconciliations. Sorted newest first. Closing balance carries forward month to month.
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">
      <select id="wlhFilterItem" onchange="renderWealth()" style="padding:6px 10px;border-radius:8px;border:1px solid var(--grey-200);font-size:13px;background:white;">
        <option value="">All Items</option>
        ${(state.wealthItems||[]).map(w => `<option value="${escapeHTML(w.name)}" ${_wlhFilterItem===w.name?'selected':''}>${escapeHTML(w.name)}</option>`).join('')}
      </select>
      <select id="wlhFilterMonth" onchange="renderWealth()" style="padding:6px 10px;border-radius:8px;border:1px solid var(--grey-200);font-size:13px;background:white;">
        <option value="">All Months</option>
        ${['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03'].map(m => {
          const [y,mo] = m.split('-');
          const label = new Date(Number(y), Number(mo)-1, 1).toLocaleString('default',{month:'short',year:'numeric'});
          return `<option value="${m}" ${_wlhFilterMonth===m?'selected':''}>${label}</option>`;
        }).join('')}
      </select>
      <span id="wlhTotal" style="font-size:12px;color:var(--grey-500);margin-left:4px;"></span>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:6px;">
      <table>
        <thead><tr>
          <th>Date</th><th>Item</th><th>Event</th><th class="numeric">Change (₹)</th><th class="numeric">Balance After</th><th>Note</th><th class="center">Del</th>
        </tr></thead>
        <tbody>
          ${(() => {
            if (!Array.isArray(state.wealthItems) || !state.wealthItems.length)
              return `<tr><td colspan="7" class="empty">No wealth items yet</td></tr>`;

            const filterItem  = _wlhFilterItem;
            const filterMonth = _wlhFilterMonth;

            // Build one unified log per item: opening, tx impacts, recons
            const rows = [];
            state.wealthItems.forEach(w => {
              const opening = Number(w.openingBalance ?? w.value ?? 0);
              rows.push({ date: '2026-04-25', itemName: w.name, type: 'opening', change: opening, valueAfter: opening, note: 'Opening balance', id: null });
              state.transactions
                .filter(t => t.wealthImpact && t.wealthImpact.itemName === w.name)
                .forEach(t => {
                  const amt = Number(t.wealthImpact.amt)||0;
                  const delta = t.wealthImpact.dir === 'reduce' ? -amt : amt;
                  rows.push({ date: t.date, itemName: w.name, type: 'transaction', change: delta, note: t.description || '', id: null, txId: t.id });
                });
              (state.wealthRecons||[])
                .filter(r => r.itemName === w.name)
                .forEach(r => {
                  rows.push({ date: r.date, itemName: w.name, type: 'recon', change: null, valueAfter: Number(r.value)||0, note: r.note || 'Manual reconciliation', id: r.id });
                });
            });

            // Sort by date descending (newest first), then item name
            rows.sort((a,b) => b.date.localeCompare(a.date) || a.itemName.localeCompare(b.itemName));

            // Compute running values going forward (ascending pass first)
            const ascRows = [...rows].sort((a,b) => a.date.localeCompare(b.date) || a.itemName.localeCompare(b.itemName));
            const runningVal = {};
            ascRows.forEach(r => {
              if (!(r.itemName in runningVal)) runningVal[r.itemName] = 0;
              if (r.type === 'recon') {
                r._after = r.valueAfter;
                runningVal[r.itemName] = r.valueAfter;
              } else if (r.type === 'opening') {
                r._after = r.change;
                runningVal[r.itemName] = r.change;
              } else {
                r._after = Math.max(0, (runningVal[r.itemName]||0) + r.change);
                runningVal[r.itemName] = r._after;
              }
            });

            // Apply filters on the descending-sorted rows
            const filtered = rows.filter(r => {
              if (filterItem && r.itemName !== filterItem) return false;
              if (filterMonth && !r.date.startsWith(filterMonth)) return false;
              return true;
            });

            // Compute grand total of Change column (sum of non-null changes in filtered rows)
            const grandTotal = filtered.reduce((s, r) => s + (r.change !== null ? (r.change||0) : 0), 0);
            // Update total count + sum label
            setTimeout(() => {
              const el = document.getElementById('wlhTotal');
              if (el) el.textContent = filtered.length ? `${filtered.length} entries` : '';
            }, 0);

            if (!filtered.length) return `<tr><td colspan="7" class="empty">No entries match the filter</td></tr>`;

            const rows_html = filtered.map(r => {
              const typePill = r.type === 'opening'
                ? `<span style="background:var(--blue-soft);color:var(--blue-text);padding:2px 7px;border-radius:100px;font-size:11px;font-weight:700;">Opening</span>`
                : r.type === 'recon'
                ? `<span style="background:var(--green-soft);color:var(--green);padding:2px 7px;border-radius:100px;font-size:11px;font-weight:700;">Reconciled</span>`
                : `<span style="background:var(--amber-soft);color:#92400E;padding:2px 7px;border-radius:100px;font-size:11px;font-weight:700;">Tx Impact</span>`;
              const changeFmt = r.change === null ? '—' :
                `<span class="${r.change>=0?'var-good':'var-bad'}" style="font-weight:600;">${r.change>=0?'+':''}${fmtINR(r.change)}</span>`;
              const delBtn = r.id
                ? `<button class="btn-ghost btn-sm" onclick="deleteWealthRecon('${r.id}')" style="color:var(--red);">✕</button>`
                : '—';
              return `<tr>
                <td>${fmtDate(r.date)}</td>
                <td><strong>${escapeHTML(r.itemName)}</strong></td>
                <td>${typePill}</td>
                <td class="numeric">${changeFmt}</td>
                <td class="numeric" style="font-weight:700;color:var(--navy);">${fmtINR(r._after ?? 0)}</td>
                <td style="font-size:12px;color:var(--grey-500);">${escapeHTML(r.note)}</td>
                <td class="center">${delBtn}</td>
              </tr>`;
            }).join('');
            const totalCls = grandTotal >= 0 ? 'var(--green)' : 'var(--red)';
            return rows_html + `<tr style="border-top:2px solid var(--grey-200);background:var(--grey-50);">
              <td colspan="3" style="font-weight:700;font-size:13px;color:var(--grey-700);padding:8px 12px;">
                Grand Total (${filtered.length} entries)
              </td>
              <td class="numeric" style="font-weight:700;font-size:14px;color:${totalCls};">
                ${grandTotal>=0?'+':''}${fmtINR(grandTotal)}
              </td>
              <td colspan="3"></td>
            </tr>`;
          })()}
        </tbody>
      </table>
    </div>

    <h3 style="margin:18px 0 10px;color:var(--navy);font-size:15px;">Asset Composition (live balances)</h3>
    <div class="chart-grid">
      <div class="chart-card">
        <h3>Where your money sits right now</h3>
        <div class="chart-wrap"><canvas id="wealthCompCanvas"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Per-Account Snapshot</h3>
        <table>
          <thead><tr><th>Account</th><th class="numeric">Balance</th></tr></thead>
          <tbody>
            ${assetComposition.map(a => `<tr>
              <td><strong>${escapeHTML(a.name)}</strong> <span style="font-size:10px;color:var(--grey-400);text-transform:uppercase;">(${a.type})</span></td>
              <td class="numeric" style="font-weight:700;color:${a.type==='credit'?'var(--red)':'var(--navy)'};">${fmtINR(a.balance)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <h3 style="margin:18px 0 10px;color:var(--navy);font-size:15px;">🎯 Goal Progress — Savings Buckets</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:14px;margin-bottom:16px;">
      ${subList.map(s => {
        const monthlyBud = (state.budget.find(b => isSavSec(b.section) && b.subcategory===s.sub)?.monthly) || 0;
        const annualTarget = monthlyBud * 12;
        const pct = annualTarget > 0 ? Math.min(100, (s.total/annualTarget)*100) : 0;
        const circ = 2 * Math.PI * 36;
        const offset = circ * (1 - pct/100);
        const ringColor = pct >= 100 ? '#10B981' : pct >= 75 ? '#06B6D4' : pct >= 50 ? '#6366F1' : pct >= 25 ? '#A78BFA' : '#EC4899';
        return `<div style="background:white;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center;">
          <div style="position:relative;width:90px;height:90px;margin:0 auto 8px;">
            <svg viewBox="0 0 90 90" style="transform:rotate(-90deg);">
              <circle cx="45" cy="45" r="36" stroke="#F4F4F5" stroke-width="8" fill="none"/>
              <circle cx="45" cy="45" r="36" stroke="${ringColor}" stroke-width="8" fill="none"
                stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
                style="transition:stroke-dashoffset .6s ease-out;"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:${ringColor};">
              ${pct.toFixed(0)}%
            </div>
          </div>
          <div style="font-size:12px;font-weight:700;color:var(--navy);">${escapeHTML(s.sub)}</div>
          <div style="font-size:11px;color:var(--grey-500);margin-top:2px;">${fmtINR(s.total)} / ${annualTarget?fmtINR(annualTarget):'no target'}</div>
        </div>`;
      }).join('')}
    </div>

    <h3 style="margin:18px 0 10px;color:var(--navy);font-size:15px;">Savings Deployment by Sub-Category</h3>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr>
          <th>Bucket</th>
          <th class="numeric">Total Deployed YTD</th>
          <th class="numeric">Avg / Month</th>
          <th>Last Contribution</th>
        </tr></thead>
        <tbody>${subRows}</tbody>
        ${subList.length ? `<tr class="subtotal-row">
          <td style="text-align:right;font-weight:700;">TOTAL</td>
          <td class="numeric" style="font-weight:700;color:var(--blue-text);">${fmtINR(totalSavingsDeployed)}</td>
          <td class="numeric"></td>
          <td></td>
        </tr>` : ''}
      </table>
    </div>

    <div class="chart-card" style="margin-top:18px;">
      <h3>Wealth Build-Up Trend — Cumulative Savings Deployment Across Cycles</h3>
      <div class="chart-wrap" style="height:320px;"><canvas id="wealthTrendCanvas"></canvas></div>
    </div>
  `;

  drawWealthComp(assetComposition);
  drawWealthTrend(cumulative);
  animateAllKPIs();
}

function saveWealthItem() {
  const fd = new FormData(document.getElementById('wealthItemForm'));
  if (!Array.isArray(state.wealthItems)) state.wealthItems = [];
  const opening = Number(fd.get('openingBalance'))||0;
  state.wealthItems.push({
    id: uid(),
    type: fd.get('type'),
    name: (fd.get('name')||'').trim(),
    openingBalance: opening,
    value: opening,          // current value starts at opening; tx impacts and recons will shift it
    notes: fd.get('notes')||'',
    updatedAt: new Date().toISOString(),
  });
  saveState(); closeModal(); refreshActiveView(); showToast('Wealth item added — saving ' + state.wealthItems.length + ' items to cloud...');
}
function deleteWealthItem(idx) {
  if (!confirm('Delete this item?')) return;
  state.wealthItems.splice(idx, 1);
  saveState(); refreshActiveView(); showToast('Item deleted');
}

  const fd = new FormData(document.getElementById('wealthEditForm'));

    ...oldItem,
    type: fd.get('type'),
    name: (fd.get('name')||'').trim(),
    openingBalance: opening,
    notes: fd.get('notes')||'',
    updatedAt: new Date().toISOString(),
  };
  saveState(); closeModal(); refreshActiveView(); showToast('Item updated');
}

// ---------- Wealth item ledger (mirrors accounts computedBalance / balanceBasis) ----------
function computedWealthValue(itemName, overrideOpening) {
  if (!Array.isArray(state.wealthItems)) return 0;
  const w = state.wealthItems.find(x => x.name === itemName);
  if (!w) return 0;
  // Base = opening balance (manual entry when item was created)
  const base = overrideOpening !== undefined
    ? overrideOpening
    : (Number(w.openingBalance) ?? Number(w.value) ?? 0);
  // Add ALL transaction impacts (reduce = negative, increase = positive)
  const txDelta = (state.transactions || [])
    .filter(t => t.wealthImpact && t.wealthImpact.itemName === itemName)
    .reduce((s, t) => {
      const amt = Number(t.wealthImpact.amt) || 0;
      return s + (t.wealthImpact.dir === 'reduce' ? -amt : amt);
    }, 0);
  // No Math.max — liabilities can go up, assets can go negative (overdraft etc.)
  return base + txDelta;
}
function wealthReconBasis(itemName) {
  if (!Array.isArray(state.wealthRecons)) state.wealthRecons = [];
  const recons = state.wealthRecons
    .filter(r => r.itemName === itemName)
    .sort((a,b) => b.date.localeCompare(a.date));
  if (recons.length) return { value: Number(recons[0].value)||0, date: recons[0].date, source: 'reconcile' };
  const w = (state.wealthItems||[]).find(x => x.name === itemName);
  return { value: Number(w?.openingBalance ?? w?.value ?? 0), date: null, source: 'opening' };
}

  document.getElementById('modalContent').innerHTML = `

function drawWealthComp(data) {
  const ctx = document.getElementById('wealthCompCanvas');
  if (!ctx) return;
  if (wealthCompChart) wealthCompChart.destroy();
  if (!data.length) {
    const c = ctx.getContext('2d');
    c.font = '13px ' + FONT.family; c.fillStyle = '#9CA3AF'; c.textAlign = 'center';
    c.fillText('No account balances yet', ctx.width/2, ctx.height/2);
    return;
  }
  // For pie, use absolute values (credit shown separately as negative bar would distort)
  const positives = data.filter(a => a.balance > 0);
  const labels = positives.map(a => a.name);
  const values = positives.map(a => a.balance);
  const colors = positives.map((a,i) => CHART_PALETTE[i % CHART_PALETTE.length]);
  wealthCompChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '55%',
      plugins: {
        legend: { position: 'right', labels: { font: FONT, boxWidth: 12 } },
        tooltip: { callbacks: { label: (ctx) => {
          const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
          const pct = (ctx.parsed/total*100).toFixed(1);
          return `${ctx.label}: ${fmtINR(ctx.parsed)} (${pct}%)`;
        }}}
      }
    }
  });
}

      ? `<span style="font-size:10px;opacity:.6;margin-left:8px;font-weight:400;">(reserved)</span>`

      rows += `<tr><td colspan="5" class="empty" style="padding:14px;">No sub-categories yet. Click "+ Add Sub-Category" above.</td></tr>`;
      return;
    }
    let secTotal = 0;

  const incBud = budgetTotal(s=>s==='Income');

  document.getElementById('view-budget').innerHTML = `

      </div>
      <div>

      </div>

      <div class="kpi green"><span class="label">Monthly Income Budget</span><span class="value">${fmtINR(incBud)}</span><span class="sub">Annual: ${fmtINR(incBud*12)}</span></div>
      <div class="kpi red"><span class="label">Monthly Expense Budget</span><span class="value">${fmtINR(expBud)}</span><span class="sub">Annual: ${fmtINR(expBud*12)}</span></div>

function buildTagOptions(sub, currentTag) {
  const tags = getTagsForSub(sub);
  const opts = tags.map(t => `<option ${t===currentTag?'selected':''}>${escapeHTML(t)}</option>`).join('');
  return opts + `<option value="__add__">+ Add new tag...</option>`;
}
function buildSubOptions(section, currentSub) {
  const subs = state.budget.filter(b => b.section===section).map(b => b.subcategory);
  if (currentSub && !subs.includes(currentSub)) subs.unshift(currentSub);
  if (!subs.length) return '<option value="">— add to Budget tab first —</option>';
  return subs.map(s => `<option ${s===currentSub?'selected':''}>${escapeHTML(s)}</option>`).join('');
}

function saveTransaction(editId) {
  const f = document.getElementById('txForm');
  const fd = new FormData(f);
  const isTransfer = fd.get('type') === 'transfer';
  const t = isTransfer ? {
    id: editId || uid(),
    type: 'transfer',
    date: fd.get('date'),
    description: fd.get('description').trim(),
    amount: Number(fd.get('amount')),
    fromAccount: fd.get('fromAccount'),
    toAccount: fd.get('toAccount'),
    notes: fd.get('notes')||'',
  } : (() => {
    const wealthOn = document.getElementById('wealthImpactToggle')?.checked;
    const wealthItemName = (fd.get('wealthImpactItem')||'').trim();
    const wealthDir = fd.get('wealthImpactDir') || 'reduce';
    const wealthAmt = Number(fd.get('wealthImpactAmt')) || Number(fd.get('amount'));
    return {
      id: editId || uid(),
      type: 'regular',
      date: fd.get('date'),
      description: fd.get('description').trim(),
      section: fd.get('section'),
      subcategory: fd.get('subcategory'),
      tag: (fd.get('tag')==='__add__' ? 'Other' : (fd.get('tag') || 'Other')),
      amount: Number(fd.get('amount')),
      paymentMode: fd.get('paymentMode'),
      account: fd.get('account'),
      notes: fd.get('notes')||'',
      wealthImpact: (wealthOn && wealthItemName) ? { itemName: wealthItemName, dir: wealthDir, amt: wealthAmt } : null,
    };
  })();
  if (!t.date || !t.description || !isFinite(t.amount)) {
    showToast('Please fill date, description, and amount', 'error');
    return;
  }
  if (isTransfer && t.fromAccount === t.toAccount) {
    showToast('From and To accounts must differ', 'error');
    return;
  }
  const beforeYTD = snapshotSavingsYTD();
  const beforeBud = snapshotBudget();
  // If editing, reverse the old wealth impact before applying the new one
  if (editId) {
    const oldTx = state.transactions.find(x => x.id===editId);
    if (oldTx?.wealthImpact) applyWealthImpact(oldTx.wealthImpact, true /* reverse */);
    const idx = state.transactions.findIndex(x => x.id===editId);
    if (idx>=0) state.transactions[idx] = t;
  } else {
    state.transactions.push(t);
  }
  // Apply new wealth impact
  if (t.wealthImpact) applyWealthImpact(t.wealthImpact, false);
  saveState();
  closeModal();
  refreshActiveView();
  const afterYTD = snapshotSavingsYTD();
  const afterBud = snapshotBudget();
  checkGoalHit(beforeBud, afterBud, beforeYTD, afterYTD);
  showToast(editId ? 'Transaction updated' : 'Transaction added');
}
// Apply (or reverse) a wealthImpact recorded on a transaction.
// computedWealthValue() is now the single source of truth — recomputes from opening + recons + tx impacts.
// This function just marks the item as updated so timestamps stay fresh.
function applyWealthImpact(impact, reverse=false) {
  if (!impact || !impact.itemName) return;
  if (!Array.isArray(state.wealthItems)) return;
  const w = state.wealthItems.find(x => x.name === impact.itemName);
  if (!w) return;
  w.updatedAt = new Date().toISOString();
}
function deleteTransaction(id) {
  if (!confirm('Delete this transaction?')) return;
  // Reverse wealth impact if present
  const tx = state.transactions.find(t => t.id === id);
  if (tx?.wealthImpact) applyWealthImpact(tx.wealthImpact, true);
  state.transactions = state.transactions.filter(t => t.id !== id);
  saveState();
  refreshActiveView();
  showToast('Transaction deleted');
}

function saveBalance() {

  state.balances.push(b);
  saveState();
  closeModal();
